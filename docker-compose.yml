services:
  backend:
    build: ./backend
    # ports:           # uncomment if you need direct access to the backend outside Docker
    #   - "8001:8000"
    ports:
      - "8001:8000"   # exposed for orchestration External Component Registry
    env_file: .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
